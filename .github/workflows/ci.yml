name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pinned MoonBit (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$(cat .moonbit-toolchain)"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Setup pinned MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MOONBIT_INSTALL_VERSION = (Get-Content .moonbit-toolchain -Raw).Trim()
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME/.moon/bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Show toolchain versions
        shell: bash
        run: |
          moon version --all
          moonc -v

      - name: Update registry index
        run: moon update

      - name: Check all compilation targets
        run: moon check --target all

      - name: Build wasm target
        run: moon build --target wasm --release

      - name: Unit tests
        run: moon test

      - name: CLI and contract smoke (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          moon build --target wasm
          ./tests/smoke.sh

      - name: CLI smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          moon build --target wasm
          # win-smoke.sh targets WSL interop; a native runner calls moonrun directly.
          moonrun _build/wasm/debug/build/wasm-tools.wasm -- --version
          moonrun _build/wasm/debug/build/wasm-tools.wasm -- parse tests/fixtures/hello.wat -o "$env:TEMP/hello.wasm"
          moonrun _build/wasm/debug/build/wasm-tools.wasm -- validate "$env:TEMP/hello.wasm"
