name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Build wasm target
        run: moon build --target wasm --release

      - name: Build native target
        run: moon build --target native --release

      - name: Unit tests
        run: moon test

      - name: CLI smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          moon build --target wasm
          ./tests/smoke.sh
