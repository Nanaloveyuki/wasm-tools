name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Moon
        uses: moonbit-community/setup-moonbit@main
        with:
          version: latest

      - name: Update registry index
        run: moon update

      - name: Build wasm target
        run: moon build --target wasm --release

      - name: Unit tests
        run: moon test

      - name: CLI smoke (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          moon build --target wasm
          ./tests/smoke.sh

      - name: CLI smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          moon build --target wasm
          # win-smoke.sh targets WSL interop; a native runner calls moonrun directly.
          moonrun _build/wasm/debug/build/wasm-tools.wasm -- --version
          moonrun _build/wasm/debug/build/wasm-tools.wasm -- parse tests/fixtures/hello.wat -o "$env:TEMP/hello.wasm"
          moonrun _build/wasm/debug/build/wasm-tools.wasm -- validate "$env:TEMP/hello.wasm"
