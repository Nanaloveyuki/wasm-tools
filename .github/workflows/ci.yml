name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pinned MoonBit (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$(cat .moonbit-toolchain)"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Setup pinned MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MOONBIT_INSTALL_VERSION = (Get-Content .moonbit-toolchain -Raw).Trim()
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME/.moon/bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Show toolchain versions
        shell: bash
        run: |
          moon version --all
          moonc -v

      - name: Update registry index
        run: moon update

      - name: Check all compilation targets
        run: moon check --target all

      - name: Build wasm target
        run: moon build --target wasm --release

      - name: Unit tests
        run: moon test

      - name: CLI and contract smoke (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          moon build --target wasm
          ./tests/smoke.sh

      - name: CLI smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          moon build --target wasm
          # win-smoke.sh targets WSL interop; a native runner calls moonrun directly.
          moonrun _build/wasm/debug/build/wasm-tools.wasm -- --version
          moonrun _build/wasm/debug/build/wasm-tools.wasm -- parse tests/fixtures/hello.wat -o "$env:TEMP/hello.wasm"
          moonrun _build/wasm/debug/build/wasm-tools.wasm -- validate "$env:TEMP/hello.wasm"

      - name: Release policies and processing
        shell: bash
        run: |
          moon build --target wasm
          python3 tests/release-check.py

      - name: Action runner integration (Linux)
        if: runner.os == 'Linux'
        run: node tests/action-runner.mjs

      - name: Release bundle consistency and real consumers
        shell: bash
        run: python3 tests/bundle-check.py

  release-action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare release-policy fixtures
        env:
          FIXTURE_DIR: ${{ runner.temp }}/wsm-action-fixtures
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          work = Path(os.environ['FIXTURE_DIR'])
          work.mkdir()
          source = work / 'app.wasm'
          source.write_bytes(b'\0asm\1\0\0\0' + b'\0\6\4metaX')
          artifact = {'id': 'app', 'input': 'app.wasm',
                      'rules': {'max_bytes': 8, 'forbidden_custom_sections': ['meta']},
                      'process': {'strip_custom_sections': ['meta']}}
          (work / 'prepare.json').write_text(json.dumps({'format_version': 1, 'artifacts': [artifact]}))
          artifact['rules']['max_bytes'] = 0
          (work / 'fail.json').write_text(json.dumps({'format_version': 1, 'artifacts': [artifact]}))
          PY

      - name: Prepare with the reusable Action
        id: prepare
        uses: ./
        with:
          config: ${{ runner.temp }}/wsm-action-fixtures/prepare.json
          mode: prepare
          install-moonhostabi: 'true'

      - name: Create an upstream ABI baseline
        env:
          PREPARED_DIR: ${{ steps.prepare.outputs.prepared-dir }}
          FIXTURE_DIR: ${{ runner.temp }}/wsm-action-fixtures
        run: |
          moonhostabi lock "$PREPARED_DIR/app.wasm" --out "$FIXTURE_DIR/app.lock.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          work = Path(os.environ['FIXTURE_DIR'])
          config = {'format_version': 1, 'artifacts': [{
              'id': 'app', 'input': str(Path(os.environ['PREPARED_DIR']) / 'app.wasm'),
              'rules': {'max_bytes': 8}, 'abi': {'baseline': 'app.lock.json'}}]}
          (work / 'abi.json').write_text(json.dumps(config))
          PY

      - name: Verify through MoonHostABI
        id: abi
        uses: ./
        with:
          config: ${{ runner.temp }}/wsm-action-fixtures/abi.json

      - name: Reject an over-budget release
        id: reject
        continue-on-error: true
        uses: ./
        with:
          config: ${{ runner.temp }}/wsm-action-fixtures/fail.json
          mode: prepare

      - name: Prepare a real MoonBit bundle
        run: |
          node scripts/make-bundle-example.mjs "$RUNNER_TEMP/wsm-action-bundle" "$(dirname "$WSM_CLI_WASM")/examples/examples.wasm"

      - name: Check the release bundle
        id: bundle
        uses: ./
        with:
          command: bundle
          config: ${{ runner.temp }}/wsm-action-bundle/bundle.json

      - name: Leave an old gzip copy in the bundle
        run: |
          python3 - <<'PY'
          import gzip, os
          from pathlib import Path
          package = Path(os.environ['RUNNER_TEMP']) / 'wsm-action-bundle' / 'package'
          (package / 'calculator.wasm.gz').write_bytes(gzip.compress(b'\0asm\1\0\0\0'))
          PY

      - name: Reject the stale compressed release copy
        id: bundle_reject
        continue-on-error: true
        uses: ./
        with:
          command: bundle
          config: ${{ runner.temp }}/wsm-action-bundle/bundle.json

      - name: Verify Action outcomes
        env:
          REJECT_OUTCOME: ${{ steps.reject.outcome }}
          REJECT_STATUS: ${{ steps.reject.outputs.status }}
          REJECT_DIRECTORY: ${{ steps.reject.outputs.prepared-dir }}
          ABI_REPORT: ${{ steps.abi.outputs.report-json }}
          BUNDLE_REPORT: ${{ steps.bundle.outputs.report-json }}
          BUNDLE_REJECT_REPORT: ${{ steps.bundle_reject.outputs.report-json }}
          BUNDLE_REJECT_OUTCOME: ${{ steps.bundle_reject.outcome }}
          BUNDLE_REJECT_STATUS: ${{ steps.bundle_reject.outputs.status }}
          BUNDLE_PREPARED_DIR: ${{ steps.bundle.outputs.prepared-dir }}
        run: |
          test "$REJECT_OUTCOME" = failure
          test "$REJECT_STATUS" = failed
          test -z "$REJECT_DIRECTORY"
          test "$BUNDLE_REJECT_OUTCOME" = failure
          test "$BUNDLE_REJECT_STATUS" = failed
          test -z "$BUNDLE_PREPARED_DIR"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ['ABI_REPORT']).read_text())
          abi = report['artifacts'][0]['abi']
          assert abi['passed'] and abi['exit_code'] == 0
          assert abi['report']['outcome'] == 'compatible'
          assert abi['report']['artifact']['sha256'] == report['artifacts'][0]['after']['sha256']
          bundle = json.loads(Path(os.environ['BUNDLE_REPORT']).read_text())
          assert bundle['mode'] == 'bundle-check' and bundle['status'] == 'passed'
          assert len(bundle['compressions']) == 2
          assert all(row['status'] == 'passed' for row in bundle['compressions'])
          assert bundle['consumers'][0]['actual'] == {'direct': 42, 'worker': 42}
          rejected = json.loads(Path(os.environ['BUNDLE_REJECT_REPORT']).read_text())
          assert rejected['status'] == 'failed'
          assert any(row['code'] == 'compression_mismatch' for row in rejected['findings'])
          PY

      - name: Upload release reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-action-reports
          path: |
            ${{ steps.prepare.outputs.report-json }}
            ${{ steps.prepare.outputs.summary }}
            ${{ steps.abi.outputs.report-json }}
            ${{ steps.reject.outputs.report-json }}
            ${{ steps.bundle.outputs.report-json }}
            ${{ steps.bundle.outputs.summary }}
            ${{ steps.bundle_reject.outputs.report-json }}
            ${{ steps.bundle_reject.outputs.summary }}
          if-no-files-found: warn
